<div class="transport-controls">
    <p>BPM: {{ scheduler.bpm() }}</p>
    <input type="range" id="bpm" min="60" max="240" [value]="scheduler.bpm()" (input)="setBpm($event)" />
</div>
<app-grid></app-grid>
<button (click)="scheduler.isPlaying() ? scheduler.stop() : scheduler.start()">{{ scheduler.isPlaying() ? 'Stop' : 'Play' }}</button>
<button (click)="sequencerState.resetPattern()">Reset</button>
