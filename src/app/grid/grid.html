<div class="grid-container">
    @for (item of sequencerState.tracks(); track item.name; let trackIndex = $index) {
            <div class="grid-row">
                <button (click)="sequencerState.toggleMute(trackIndex)">{{!item.muted ? 'Mute' : 'Unmute'}}</button>
                <button (click)="sequencerState.toggleSolo(trackIndex)">{{!item.soloed ? 'Solo' : 'Unsolo'}}</button>
                <div class="grid-cell">{{ item.name }}</div>
                @for (step of item.steps; track $index; let stepIndex = $index) {
                    <div class="grid-cell" (click)="sequencerState.toggleClick(trackIndex, stepIndex)" [class.active]="step">{{ step }}</div>
                }
            </div>
    } @empty {
        <li>There are no items.</li>
    }
</div>
