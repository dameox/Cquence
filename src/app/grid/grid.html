<div class="grid-container">
    @for (item of tracks; track item.name) {
            <div class="grid-row">
                <div class="grid-cell">{{ item.name }}</div>
                @for (step of item.steps; track $index) {
                    <div class="grid-cell" [class.active]="step">{{ step }}</div>
                }
            </div>
    } @empty {
        <li>There are no items.</li>
    }
</div>
